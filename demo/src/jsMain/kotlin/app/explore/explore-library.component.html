<mat-sidenav-container class="explorer-shell">
    <mat-sidenav class="drawer" [mode]="$any(navMode)" [opened]="navOpened" (openedChange)="navOpened = $event">
        <nav class="side">
            <div class="nav-group">Get started</div>
            <a class="nav-item"
               *ngFor="let f of getStarted"
               [routerLink]="'/' + f.id"
               routerLinkActive="active"
               (click)="closeNavOnMobile()">
                <mat-icon>{{f.icon}}</mat-icon>
                <span>{{f.label}}</span>
            </a>

            <div class="nav-group">Examples</div>
            <a class="nav-item"
               *ngFor="let f of examples"
               [routerLink]="'/' + f.id"
               routerLinkActive="active"
               (click)="closeNavOnMobile()">
                <mat-icon>{{f.icon}}</mat-icon>
                <span>{{f.label}}</span>
            </a>
        </nav>
    </mat-sidenav>

    <mat-sidenav-content class="main">
        <!-- Mobile-only bar: a hamburger that opens the nav drawer. -->
        <div class="mobile-bar">
            <button mat-icon-button (click)="toggleNav()" aria-label="open navigation">
                <mat-icon>menu</mat-icon>
            </button>
            <span class="mobile-title">Explore</span>
        </div>

        <section class="content">
            <!-- The selected page renders here — one route per nav entry (see AppRoutingModule). -->
            <router-outlet></router-outlet>
        </section>

        <footer class="app-footer">
            <span>© 2020-2026 Developed by Vlad Kalyuzhny</span>
            <span class="dot">·</span>
            <a href="https://github.com/vladkalyuzhny/AngularKt" target="_blank" rel="noopener">
                <svg class="gh" viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
                Source code
            </a>
        </footer>
    </mat-sidenav-content>
</mat-sidenav-container>
