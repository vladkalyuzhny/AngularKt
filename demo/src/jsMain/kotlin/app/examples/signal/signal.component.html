<div class="counter">
    <button mat-stroked-button color="primary" class="round" (click)="dec()">−</button>
    <span class="value">{{count()}}</span>
    <button mat-raised-button color="primary" class="round" (click)="inc()">+</button>
</div>
<p class="derived">×2 (computed) = {{doubled()}}</p>
