name: Deploy demo to GitHub Pages

# Builds the AOT demo (optimized Angular bundle, no @angular/compiler) and publishes it to
# GitHub Pages at https://vladkalyuzhny.github.io/AngularKt/. AOT is the right mode for a static
# host: the output is a plain Angular dist. The router needs the site to live under /AngularKt/,
# so we rewrite <base href> and add a 404.html SPA fallback (Pages has no server-side rewrite).
on:
  # Deploy on every push to the site branch. Change `master` if you publish from another branch.
  push:
    branches: [master]
  # Manual "Run workflow" button in the Actions tab.
  workflow_dispatch:

# The base path the app is served from. A user/org project page lives under /<repo>/, so the
# app's <base href> and asset URLs must be prefixed with it. For a future angularkt.github.io
# (org root) this becomes "/".
env:
  BASE_HREF: /AngularKt/

# Pages deploy needs to read the repo and mint an id-token for the deploy step.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two site deploys at once; let an in-flight run finish (don't cancel a live deploy).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The Gradle wrapper jar/scripts are gitignored in this repo, so install the pinned version
      # (matches gradle/wrapper/gradle-wrapper.properties) and call `gradle` directly, mirroring
      # build-matrix.yml. The Kotlin Gradle plugin downloads its own Node for the Angular CLI.
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Full AOT pipeline: Kotlin library -> KSP .ts bridges -> ng new -> npm install -> ng build
      # --configuration production. Output lands in demo/build/ng-aot/dist/ng-aot/.
      - name: Build demo (AOT)
        run: gradle :demo:aotBuild --stacktrace

      # Locate the produced dist (the dir that actually holds index.html): the Angular 17+
      # application builder emits dist/ng-aot/browser/, older majors emit dist/ng-aot/. Then set
      # the base href for the project subpath, add a 404.html SPA fallback so deep links / reloads
      # work, and drop .nojekyll so Pages serves files/dirs starting with "_" verbatim.
      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          index_html="$(find demo/build/ng-aot/dist -name index.html -maxdepth 3 | head -n1)"
          if [ -z "$index_html" ]; then
            echo "::error::No index.html found under demo/build/ng-aot/dist"; exit 1
          fi
          site_dir="$(dirname "$index_html")"
          echo "Publishing $site_dir"
          # Rewrite <base href="/"> (or any current value) to the project subpath.
          sed -i -E "s#<base href=\"[^\"]*\">#<base href=\"${BASE_HREF}\">#" "$index_html"
          cp "$index_html" "$site_dir/404.html"
          touch "$site_dir/.nojekyll"
          echo "SITE_DIR=$site_dir" >> "$GITHUB_ENV"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
