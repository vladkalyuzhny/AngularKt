kotlin.code.style=official
# Gradle perf
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# the library properties
group=io.github.vladkalyuzhny
version=0.1.0
# Target Angular major version (floor 16). Drives the @angular/* npm coordinate (jit) and
# the processor's capability profile. A bare major like 22 resolves to ~22.0.0. Bump it
# to retarget; for AOT this re-scaffolds build/ng-aot from scratch at the
# new version (no ng update, nothing checked in).
angularKt.angularVersion=22
